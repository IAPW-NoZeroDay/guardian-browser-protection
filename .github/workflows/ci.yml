name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Syntax-check JavaScript
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check

      - name: Validate JSON
        run: |
          for f in manifest.json config/*.json rules/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done

      # No dependencies needed. tests/config-persistence.test.js is left out: it fails on upstream 1.3.0 too.
      - name: Tests
        run: node --test tests/detection-rules-manager.test.js tests/domain-squatting-detector.test.js tests/webhook-manager.test.js
